name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build raidTimeline.sln -c Release
      # Integration tests need network access and a local Elite Insights install.
      - run: dotnet test raidTimeline.sln -c Release --no-build --filter "Category!=Integration"
      # The page (raidTimeline.Logic/template.html) is JavaScript; these tests run it in jsdom.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests-js/package-lock.json
      - run: npm ci
        working-directory: tests-js
      - run: npm test
        working-directory: tests-js
